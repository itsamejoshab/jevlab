[project]
name = "jevlab"
version = "0.1.0"
description = "Offline search lab for Trick Jev: snapshot the site, search phrases against the OpenRouter Jev oracle, publish winners later."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joshua Berry" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "textual>=0.80",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "wordfreq>=3.1.1",
]

[project.optional-dependencies]
embed = ["fastembed>=0.4"]
laya = ["laya>=0.3.22"]
clef = [
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "huggingface-hub>=0.26",
    "pillow>=10",
    "safetensors>=0.4",
    "transformers>=5.10.2",
]

[project.scripts]
jevlab = "jevlab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E731", "B008", "B023", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E401", "E402", "E702", "E741", "B007", "F841"]
